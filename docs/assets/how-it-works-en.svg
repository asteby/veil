@keyframes k_q7{0%{opacity:0;transform:translate(807px,288px)}6%{opacity:1}80.00%{transform:translate(807px,340px);opacity:1}88.00%{opacity:0;transform:translate(807px,340px)}100%{opacity:0;transform:translate(807px,340px)}}
