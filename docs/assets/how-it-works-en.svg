@keyframes k_q9{0%{opacity:0;transform:translate(883px,340px)}6%{opacity:1}80.00%{transform:translate(883px,128px);opacity:1}88.00%{opacity:0;transform:translate(883px,128px)}100%{opacity:0;transform:translate(883px,128px)}}
.q9{opacity:0;animation:k_q9 4.2s linear 2.6s infinite}
@keyframes k_glass{0%,100%{opacity:.16}50%{opacity:.3}}
.glassHatch{animation:k_glass 3.6s ease-in-out infinite}
.pk,.caret{opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.pt{display:none}}</style>
<defs>
