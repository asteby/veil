name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = minimum (scrypt), 22 = LTS, 24 = argon2id in node:crypto (>= 24.7)
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install Chromium for web_capture tests
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - name: Unit, property and integration tests
        run: pnpm test
      - run: pnpm build
      - name: Package contents (@asteby/veil, not published)
        run: npm pack --dry-run

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: SHOTS_DIR=test-results/shots pnpm test:e2e
      - name: README visuals still render (screenshots + recording)
        continue-on-error: true
        run: |
          sudo apt-get install -y ffmpeg
          node scripts/readme-assets/make-svgs.mjs
          pnpm exec playwright test --config scripts/readme-assets/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
