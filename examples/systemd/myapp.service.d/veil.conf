# Drop-in for an EXISTING unit: /etc/systemd/system/<app>.service.d/veil.conf
# Veil reads the key from $CREDENTIALS_DIRECTORY/veil-key (the former name veilform-key is also
# read, so units deployed before the rename keep working; VEIL_CREDENTIAL=<name> picks another).
[Service]
LoadCredential=veil-key:/etc/veil/myapp.key
ExecStart=
ExecStart=/usr/bin/veil run --env /etc/myapp/.env.production -- /usr/bin/node /srv/myapp/server.js
