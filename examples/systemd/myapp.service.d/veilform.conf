# Drop-in for an EXISTING unit: /etc/systemd/system/<app>.service.d/veilform.conf
# veilform reads the key from $CREDENTIALS_DIRECTORY/veilform-key (or VEILFORM_CREDENTIAL=<name>).
[Service]
LoadCredential=veilform-key:/etc/veilform/myapp.key
ExecStart=
ExecStart=/usr/bin/veilform run --env /etc/myapp/.env.production -- /usr/bin/node /srv/myapp/server.js
